server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Plain scripts with no build step: always revalidate so changes show up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # not in nginx's mime.types; browsers want this type to install the app
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
